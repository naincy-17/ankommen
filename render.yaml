databases:
  - name: ankommen-db
    databaseName: ankommen
    plan: basic-256mb

services:
  - type: web
    name: ankommen-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python create_tables.py && python seed_data.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ankommen-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
